<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Naruto Shinobi Adventure V19</title>
<style>
:root{
  --bg:#0e1016;--panel:#171a22;--card:#1d2230;--text:#f4f6fb;--muted:#aab1c0;
  --accent:#ff6b35;--accent2:#6c63ff;--border:#31384a;--good:#3ddc97;--bad:#ff5d73;
}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#0b0d12,#121722);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit} .app{max-width:1200px;margin:auto;padding:16px}.row{display:flex;gap:12px;flex-wrap:wrap}.between{justify-content:space-between;align-items:center}.grid{display:grid;gap:12px}.g2{grid-template-columns:1.15fr .85fr}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}.g8{grid-template-columns:repeat(8,1fr)}
@media(max-width:900px){.g2,.g4,.g6,.g8{grid-template-columns:1fr 1fr}}@media(max-width:560px){.g2,.g4,.g6,.g8{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:16px}.stat{background:#141924;border:1px solid var(--border);border-radius:14px;padding:12px}.stat small{color:var(--muted);display:block}.big{font-size:1.5rem;font-weight:800}.muted{color:var(--muted)}.hidden{display:none!important}.btn{min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--border);background:#151a24;cursor:pointer}.btn.primary{background:#2a2030;border-color:#6c4bff}.btn:disabled{opacity:.45;cursor:not-allowed}.wheelwrap{position:relative;max-width:430px;margin:0 auto}.pointer{position:absolute;z-index:3;left:50%;top:-2px;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid white}.spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:#2a2030;border:2px solid #6c4bff;font-weight:900;cursor:pointer}.sheetline{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--border);padding:8px 0}.tag{display:inline-block;border:1px solid var(--border);padding:3px 8px;border-radius:999px;font-size:.78rem}.danger{color:#ff9eaa}.good{color:#7ff0bd}.logline{border-bottom:1px solid var(--border);padding:8px 0}.sectiontitle{font-size:.78rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted)}
</style>
</head>
<body>
<div id="app" class="app">
  <div class="row between">
    <div><div class="sectiontitle">Naruto Shinobi Adventure</div><div id="title" class="big">Build Your Shinobi — V19</div></div>
    <button id="restart" class="btn">Restart Story</button>
  </div>

  <section id="build" class="grid g2" style="margin-top:14px">
    <div class="card">
      <div class="row between"><strong id="cat"></strong><span id="step" class="muted"></span></div>
      <div class="wheelwrap" style="margin-top:12px"><div class="pointer"></div><svg id="buildWheel" viewBox="0 0 420 420" style="width:100%"></svg><button id="spinBuild" class="spin">SPIN</button></div>
      <div id="buildStatus" class="muted" style="text-align:center;margin-top:10px"></div>
    </div>
    <aside class="card"><strong>Character Sheet</strong><div id="profile" style="margin-top:10px"></div></aside>
  </section>

  <section id="adv" class="hidden" style="margin-top:14px">
    <div class="grid g8">
      <div class="stat"><small>HP</small><div id="hp"></div></div>
      <div class="stat"><small>Chakra</small><div id="chakra"></div></div>
      <div class="stat"><small>Power</small><div id="power"></div></div>
      <div class="stat"><small>Wins</small><div id="wins"></div></div>
      <div class="stat"><small>Victory Power</small><div id="victoryBonus"></div></div>
      <div class="stat"><small>Bijū Form</small><div id="form"></div></div>
      <div class="stat"><small>Status</small><div id="status"></div></div>
      <div class="stat"><small>Power Cap</small><div>6500</div></div>
    </div>

    <div class="card" style="margin-top:12px"><strong>Progression</strong><div id="progression" class="grid g6" style="margin-top:10px"></div></div>

    <div id="mainCard" class="card" style="margin-top:12px">
      <div class="sectiontitle">Adventure</div><div id="mainTitle" class="big">Spin for your next event.</div><div id="mainInfo" class="muted" style="margin-top:6px"></div>
      <button id="eventBtn" class="btn primary" style="width:100%;margin-top:14px">Spin Adventure Event</button>
    </div>

    <div id="wheelBox" class="card hidden" style="margin-top:12px">
      <div id="wheelTitle" class="big" style="text-align:center"></div>
      <div class="wheelwrap" style="max-width:360px;margin-top:12px"><div class="pointer"></div><svg id="actionWheel" viewBox="0 0 420 420" style="width:100%"></svg><button id="spinAction" class="spin">SPIN</button></div>
      <div id="result" style="text-align:center;font-weight:800;margin-top:10px"></div>
    </div>

    <div id="encounter" class="card hidden" style="margin-top:12px">
      <div class="sectiontitle">Encounter</div><div id="enemy" class="big"></div><div id="enemyInfo" class="muted" style="margin-top:6px"></div><div id="odds" style="margin-top:8px;font-weight:700"></div><div id="danger" class="danger" style="margin-top:6px"></div>
      <div class="grid g4" style="margin-top:14px"><button id="trainEncounter" class="btn">🥋 Train</button><button id="escape" class="btn">💨 Escape</button><button id="fight" class="btn primary">⚔️ Fight</button><button id="befriend" class="btn">🤝 Befriend</button></div>
    </div>

    <div id="tree" class="card hidden" style="margin-top:12px"><div class="big">🌳 Divine Tree</div><div class="muted" style="margin-top:6px">Rare event. The Chakra Fruit can transform your entire run.</div><div class="grid g2" style="margin-top:14px"><button id="eatFruit" class="btn primary">🍎 Eat Chakra Fruit</button><button id="leaveTree" class="btn">Leave</button></div></div>

    <div class="card" style="margin-top:12px"><strong>Adventure Log</strong><div id="log" class="muted" style="margin-top:10px"><div class="logline">Your story begins.</div></div></div>
  </section>
</div>

<script>
(()=>{
const root=document.getElementById('app'),q=s=>root.querySelector(s),NS='http://www.w3.org/2000/svg';
window.addEventListener('error',e=>{
  const s=q('#buildStatus');
  if(s)s.textContent='Game error: '+(e.message||'unknown');
});
const CAP=6500, LEGACY_POWER=3000;
let session=0;const timers=new Set();
function later(fn,ms){const s=session,id=setTimeout(()=>{timers.delete(id);if(s===session)fn()},ms);timers.add(id)}
function clearTimers(){timers.forEach(clearTimeout);timers.clear()}

const base=[
['Alignment',['Hero','Villain']],
['Race / Origin',['Shinobi','Shinobi','Ōtsutsuki Descendant','Zetsu','Ōtsutsuki']],
['Clan',['Uchiha','Uzumaki','Hyūga','Senju','Nara','Akimichi','Aburame','Inuzuka']],
['Natural Eye',['None','None','Byakugan','Sharingan','Rinnegan','Tenseigan','Jōgan']],
['Number of Kekkei Genkai',['1','1','2','2','3','4']],
['Kekkei Genkai',['Wood Release','Ice Release','Lava Release','Magnet Release','Storm Release','Boil Release','Scorch Release','Crystal Release','None']],
['Jinchūriki?',['Yes','No','No','No']],
['Number of Chakra Natures',['1','1','2','2','3','4']],
['Chakra Nature',['Fire','Wind','Lightning','Earth','Water']],
['Strength',['Normal Human','Building Strength','Mountain Strength','Village Destroyer','Army-Level Strength','Multi-Army Strength','Bijū-Level Strength','Godlike Strength','Planetary Strength']],
['Speed',['Normal','Genin Speed','Jōnin Speed','Lightning Speed','Near Light Speed','Light Speed','FTL Speed','Extreme FTL','Godlike Speed']],
['Durability',['Normal Human','Wall Durability','House Durability','Mountain Durability','Village Durability','Bijū-Level Durability','Continental Durability','Godlike Durability','Planetary Durability']],
['Specialty',['Ninjutsu','Taijutsu','Genjutsu','Medical Ninjutsu','Sealing Jutsu','Kenjutsu','Space-Time Ninjutsu']],
['Weapon',['Kunai','Katana','Shuriken','War Fan','Chakra Blades','Staff','None']],
['Summoning',['Toads','Snakes','Slugs','Ninken','Hawks','Monkeys','None']],
['Rank',['Genin','Chūnin','Jōnin','ANBU','Kage-level','Missing-nin']],
['Trait',['Huge Chakra','High Intelligence','Fast Learner','Regeneration','Perfect Chakra Control','Extreme Speed','Huge Stamina']]
];
const strT=base[9][1],spdT=base[10][1],durT=base[11][1];

const beasts=[
{name:'Shukaku',tails:1,seal:52},{name:'Matatabi',tails:2,seal:48},{name:'Isobu',tails:3,seal:44},
{name:'Son Gokū',tails:4,seal:40},{name:'Kokuō',tails:5,seal:36},{name:'Saiken',tails:6,seal:32},
{name:'Chōmei',tails:7,seal:28},{name:'Gyūki',tails:8,seal:23},{name:'Kurama',tails:9,seal:18},{name:'Ten-Tails',tails:10,seal:5}
];
const buildBeasts=beasts.slice(0,9).map(b=>`${b.name} — ${b.tails} Tails`);
const clanBuffs={Uchiha:{s:0,v:2,d:1},Uzumaki:{s:1,v:0,d:3},Hyūga:{s:1,v:2,d:0},Senju:{s:2,v:1,d:2},Nara:{s:0,v:0,d:0},Akimichi:{s:2,v:0,d:1},Aburame:{s:0,v:0,d:1},Inuzuka:{s:1,v:1,d:0},'Ōtsutsuki Clan':{s:3,v:3,d:3},Zetsu:{s:1,v:0,d:1}};
const raceBuffs={'Ōtsutsuki':{s:3,v:3,d:3},'Ōtsutsuki Descendant':{s:2,v:2,d:2},Zetsu:{s:1,v:0,d:2},Shinobi:{s:0,v:0,d:0}};
const eyeValue={None:0,Byakugan:90,Sharingan:150,'Mangekyō Sharingan':180,'Eternal Mangekyō Sharingan':195,Rinnegan:200,Tenseigan:250,Jōgan:300,'Rinne Sharingan':350,'Sukunahikona Eye':375};
const giftRarity={
  'Byakugan':{rarity:'Uncommon',weight:24},
  'Sharingan':{rarity:'Rare',weight:20},
  'Mangekyō Sharingan':{rarity:'Epic',weight:12},
  'Eternal Mangekyō Sharingan':{rarity:'Legendary',weight:8},
  'Rinnegan':{rarity:'Legendary',weight:6},
  'Tenseigan':{rarity:'Mythic',weight:4},
  'Jōgan':{rarity:'Mythic',weight:3},
  'Rinne Sharingan':{rarity:'Divine',weight:2},
  'Sukunahikona Eye':{rarity:'Divine',weight:1},
  'Divine Fruit':{rarity:'Divine',weight:2}
};
function weightedGiftPool(){
  const arr=[];
  Object.entries(giftRarity).forEach(([name,o])=>{for(let i=0;i<o.weight;i++)arr.push(name)});
  return arr.sort(()=>Math.random()-.5);
}


const people=[
{name:'Sakura Haruno',power:900,agg:45},{name:'Kakashi Hatake',power:1050,eye:'Sharingan',agg:58},{name:'Tsunade',power:1100,agg:55},{name:'Hiruzen Sarutobi',power:1125,agg:60},
{name:'Jiraiya',power:1180,agg:58},{name:'Orochimaru',power:1225,agg:92,reanimate:true},{name:'Kabuto Yakushi',power:1275,agg:88,reanimate:true},{name:'Tobirama Senju',power:1350,clan:'Senju',agg:68,reanimate:true},
{name:'Minato Namikaze',power:1450,agg:70},{name:'Itachi Uchiha',power:1450,eye:'Mangekyō Sharingan',clan:'Uchiha',agg:72},{name:'Obito Uchiha',power:1550,eye:'Mangekyō Sharingan',clan:'Uchiha',agg:88},
{name:'Hashirama Senju',power:1650,clan:'Senju',agg:60},{name:'Madara Uchiha',power:1700,eye:'Rinne Sharingan',clan:'Uchiha',agg:96},{name:'Gaara',power:1150,beast:'Shukaku',agg:62},
{name:'Yugito Nii',power:1050,beast:'Matatabi',agg:60},{name:'Yagura',power:1200,beast:'Isobu',agg:72},{name:'Rōshi',power:1125,beast:'Son Gokū',agg:66},{name:'Han',power:1150,beast:'Kokuō',agg:65},
{name:'Utakata',power:1075,beast:'Saiken',agg:55},{name:'Fū',power:1075,beast:'Chōmei',agg:50},{name:'Killer B',power:1450,beast:'Gyūki',agg:55},{name:'Naruto Uzumaki',power:1750,beast:'Kurama',clan:'Uzumaki',agg:70},
{name:'Neji Hyūga',power:850,eye:'Byakugan',clan:'Hyūga',agg:45},{name:'Hinata Hyūga',power:800,eye:'Byakugan',clan:'Hyūga',agg:30},{name:'Shisui Uchiha',power:1300,eye:'Mangekyō Sharingan',clan:'Uchiha',agg:65},
{name:'Sasuke Uchiha',power:1750,eye:'Rinnegan',clan:'Uchiha',agg:82},{name:'Pain',power:1500,eye:'Rinnegan',agg:90},{name:'Nagato',power:1550,eye:'Rinnegan',clan:'Uzumaki',agg:85},
{name:'Toneri Ōtsutsuki',power:2000,eye:'Tenseigan',race:'Ōtsutsuki Descendant',agg:85},{name:'Kinshiki Ōtsutsuki',power:2400,race:'Ōtsutsuki',agg:90},{name:'Urashiki Ōtsutsuki',power:2750,eye:'Rinnegan',race:'Ōtsutsuki',agg:95},
{name:'Momoshiki Ōtsutsuki',power:3500,eye:'Rinnegan',race:'Ōtsutsuki',agg:100},{name:'Hagoromo Ōtsutsuki',power:4500,eye:'Rinnegan',race:'Ōtsutsuki',agg:65},{name:'Kaguya Ōtsutsuki',power:5500,eye:'Rinne Sharingan',race:'Ōtsutsuki',agg:100},
{name:'Black Zetsu',power:1350,race:'Zetsu',agg:92},{name:'Isshiki Ōtsutsuki',power:6500,eye:'Sukunahikona Eye',race:'Ōtsutsuki',agg:100}
];
const groups=[
{name:'Akatsuki',power:2400,agg:95,members:'Pain, Itachi, Kisame, Deidara, Sasori, Kakuzu, Hidan, Konan, Zetsu'},
{name:'Five Kage',power:2700,agg:75,members:'Five Kage'},
{name:'Team 7',power:3100,agg:78,members:'Naruto, Sasuke, Sakura, Kakashi'},
{name:'Legendary Sannin',power:2500,agg:70,members:'Jiraiya, Tsunade, Orochimaru'},
{name:'Uchiha Legends',power:3600,agg:100,members:'Madara, Obito, Itachi, Shisui'},
{name:'Jinchūriki Alliance',power:4000,agg:85,members:'Multiple Jinchūriki'}
];
const reanimators=[{name:'Orochimaru',power:1225},{name:'Kabuto Yakushi',power:1275},{name:'Tobirama Senju',power:1350},{name:'Forbidden Jutsu Master',power:1150},{name:'Unknown Missing-nin',power:1000},{name:'Rogue Shinobi',power:950}];
const heroNames=new Set(['Sakura Haruno','Kakashi Hatake','Tsunade','Hiruzen Sarutobi','Jiraiya','Tobirama Senju','Minato Namikaze','Hashirama Senju','Gaara','Yugito Nii','Yagura','Rōshi','Han','Utakata','Fū','Killer B','Naruto Uzumaki','Neji Hyūga','Hinata Hyūga','Shisui Uchiha','Sasuke Uchiha','Hagoromo Ōtsutsuki']);
const villainNames=new Set(['Black Zetsu','Orochimaru','Kabuto Yakushi','Madara Uchiha','Obito Uchiha','Pain','Nagato','Kinshiki Ōtsutsuki','Urashiki Ōtsutsuki','Momoshiki Ōtsutsuki','Kaguya Ōtsutsuki','Isshiki Ōtsutsuki']);
people.forEach(p=>p.faction=heroNames.has(p.name)?'Hero':villainNames.has(p.name)?'Villain':'Neutral');
groups.forEach(g=>g.faction=({'Akatsuki':'Villain','Five Kage':'Hero','Team 7':'Hero','Legendary Sannin':'Hero','Uchiha Legends':'Villain','Jinchūriki Alliance':'Hero'})[g.name]||'Neutral');


let cats=[],idx=0,rot=0,busy=false,picks=[],kgCount=1,kgs=[],natureCount=1,natures=[],current=null,currentType='',mode='',values=[],aRot=0,state,legacySeed=null,pendingLoss=[],pendingEyeTargets=[];

function newState(){return{hp:100,ch:100,wins:0,training:0,str:0,spd:0,dur:0,eyeStage:0,bijuLevel:0,beasts:[],ten:false,stolenEyes:[],bonus:0,victoryBonus:0,baryonUsed:false,legacyTriggered:false,hokage:false,isHeir:false,reanimated:false,reanimator:null,edoSpins:0,friends:[],lastGift:'None',nativeArmLost:false,stolenArms:[],winLoot:[]}}
function pol(r,a){const x=(a-90)*Math.PI/180;return{x:210+r*Math.cos(x),y:210+r*Math.sin(x)}}
function arc(r,a,b){const p=pol(r,a),z=pol(r,b);return`M210 210L${p.x} ${p.y}A${r} ${r} 0 0 1 ${z.x} ${z.y}Z`}
function draw(svg,vals,rotation,id){
  svg.innerHTML='';
  const sl=360/vals.length,g=document.createElementNS(NS,'g');
  g.id=id;
  g.style.transformOrigin='210px 210px';
  g.style.transform=`rotate(${rotation}deg)`;
  g.style.transition='transform 2s cubic-bezier(.1,.7,.15,1)';
  vals.forEach((v,i)=>{
    const start=i*sl,end=(i+1)*sl,mid=start+sl/2;
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',arc(190,start,end));
    p.setAttribute('fill',`hsl(${(i*55+20)%360} 62% 42%)`);
    p.setAttribute('stroke','#22293a');
    p.setAttribute('stroke-width','2');
    g.appendChild(p);

    const z=pol(125,mid),t=document.createElementNS(NS,'text');
    t.setAttribute('x',z.x); t.setAttribute('y',z.y);
    t.setAttribute('text-anchor','middle');
    t.setAttribute('dominant-baseline','middle');
    t.setAttribute('fill','white');
    t.setAttribute('font-size',v.length>22?'7':v.length>16?'8.5':'10');
    t.setAttribute('font-weight','700');
    // keep labels upright on both sides
    let ang=mid;
    if(ang>90&&ang<270) ang+=180;
    t.setAttribute('transform',`rotate(${ang} ${z.x} ${z.y})`);
    t.textContent=v;
    g.appendChild(t);
  });
  svg.appendChild(g);
}
function add(k,v){picks.push([k,v])} function get(k){return picks.find(x=>x[0]===k)?.[1]}
function currentRace(){return get('Race / Origin')||'Unknown'}
function currentClan(){return get('Clan')||'Unknown'}

function lineage(){let b={s:0,v:0,d:0};[raceBuffs[get('Race / Origin')],clanBuffs[get('Clan')]].forEach(x=>{if(x){b.s+=x.s;b.v+=x.v;b.d+=x.d}});return{s:Math.min(3,b.s),v:Math.min(3,b.v),d:Math.min(3,b.d)}}
function boosted(name){const arr=name==='Strength'?strT:name==='Speed'?spdT:durT,baseVal=get(name),i=Math.max(0,arr.indexOf(baseVal)),l=lineage(),tr=name==='Strength'?state.str:name==='Speed'?state.spd:state.dur,b=name==='Strength'?l.s:name==='Speed'?l.v:l.d,f=Math.min(arr.length-1,i+Math.min(3,b+tr));return{base:baseVal,final:arr[f],i:f}}
function naturalEye(){const e=get('Natural Eye');if(e==='Sharingan')return ['Sharingan','Mangekyō Sharingan','Eternal Mangekyō Sharingan','Rinnegan'][Math.min(3,state.eyeStage)];if(e==='Byakugan')return state.eyeStage>=1?'Tenseigan':'Byakugan';return e||'None'}
function currentBeast(){if(state.ten)return beasts[9];if(state.beasts.length)return state.beasts[state.beasts.length-1];return beasts.find(b=>String(get('Tailed Beast')||'').startsWith(b.name))||null}
function bijuStageLabels(){const b=currentBeast();if(!b)return['None'];const arr=['Base Jinchūriki'];for(let i=1;i<=b.tails;i++)arr.push(`${i}-Tail Form`);arr.push('Chakra Mode','Mastered Chakra Mode','Full Tailed Beast');return arr}
function form(){const arr=bijuStageLabels();const i=Math.min(arr.length-1,state.bijuLevel);return{label:arr[i],index:i,max:arr.length-1}}
function masteredTier(){const b=currentBeast();if(!b)return 0;const i=form().index, tailEnd=b.tails; if(i===tailEnd+1)return 250; if(i===tailEnd+2)return 350; if(i>=tailEnd+3)return b.name==='Ten-Tails'?2000:500; return 0}
function formMultiplier(){const b=currentBeast();if(!b)return 1;const i=form().index,tailEnd=b.tails; if(i===0)return 1.02; if(i<=tailEnd)return 1+0.04*i; if(i===tailEnd+1)return 1.45; if(i===tailEnd+2)return 1.65; return 1.9}
function eyePower(){return(eyeValue[naturalEye()]||0)+state.stolenEyes.reduce((n,e)=>n+(eyeValue[e]||0),0)}
function phys(n){return 120+boosted(n).i*85}
function maxCh(){return 100+(get('Race / Origin')==='Ōtsutsuki'?250:get('Race / Origin')==='Ōtsutsuki Descendant'?100:get('Race / Origin')==='Zetsu'?50:0)+(currentBeast()?100:0)+(state.ten?200:0)}
function rawPower(){let p=(phys('Strength')+phys('Speed')+phys('Durability'))/3+eyePower()+kgs.filter(x=>x!=='None').length*60+state.training*20+state.bonus+state.victoryBonus;if(get('Race / Origin')==='Ōtsutsuki')p+=700;else if(get('Race / Origin')==='Ōtsutsuki Descendant')p+=250;if(state.hokage)p=Math.max(p,1000);if(state.stolenEyes.length>=3)p*=1.5;p*=formMultiplier();p+=masteredTier();return Math.round(p)}
function power(){return Math.min(CAP,rawPower())}
function enemyPower(){if(currentType==='group')return current.power;if(currentType==='beast')return current.name==='Ten-Tails'?3000:900+current.tails*120;return current.power+(current.beast?500:0)}
function weighted(ch,a,b){const arr=[];for(let i=0;i<20;i++)arr.push(i<Math.max(1,Math.min(19,Math.round(ch/5)))?a:b);return arr.sort(()=>Math.random()-.5)}
function winChance(){if(power()===CAP&&enemyPower()===CAP)return 50;return Math.max(5,Math.min(95,Math.round(50+(power()-enemyPower())/55)))}
function aggression(){return currentType==='group'?current.agg:currentType==='beast'?80+current.tails:current.agg||50}
function escapeChance(){let c=72-(Math.max(0,enemyPower()-power())/70)-(aggression()-50)*.5;if(boosted('Speed').i>=7)c+=15;if(get('Specialty')==='Space-Time Ninjutsu')c+=25;return Math.max(5,Math.min(95,Math.round(c)))}
function trainChance(){let c=68-(Math.max(0,enemyPower()-power())/65)-(aggression()-50)*.6;return Math.max(5,Math.min(95,Math.round(c)))}
function canBefriend(){return currentType==='person'||currentType==='group'}
function befriendChance(){if(!canBefriend())return 0;const mine=get('Alignment')||'Hero',theirs=current.faction||'Neutral';let c=theirs==='Neutral'?45:(mine===theirs?72:24);if(enemyPower()>power())c-=Math.min(20,Math.round((enemyPower()-power())/180));if(state.friends.includes(current.name))c=95;return Math.max(5,Math.min(95,c))}

function handle(res){q('#result').textContent=res;
if(mode==='event'){if(res==='Train')return later(()=>openWheel('What do you train?','train',['Strength','Speed','Durability','Kekkei Genkai','Tailed Beast']),450);if(res==='Divine Tree'){q('#wheelBox').classList.add('hidden');q('#tree').classList.remove('hidden');return}if(res==='Group'){currentType='group';current=groups[Math.floor(Math.random()*groups.length)]}else if(res==='Wild Bijū'){currentType='beast';current=beasts[Math.floor(Math.random()*9)]}else if(res==='Jinchūriki'){const p=people.filter(x=>x.beast);currentType='person';current=p[Math.floor(Math.random()*p.length)]}else if(res==='Ōtsutsuki'){const p=people.filter(x=>String(x.race||'').includes('Ōtsutsuki'));currentType='person';current=p[Math.floor(Math.random()*p.length)]}else{currentType='person';current=people[Math.floor(Math.random()*people.length)]}showEncounter();return}

if(mode==='attemptEscape'){if(res==='ESCAPED'){log(`💨 Escaped from ${current.name}.`);return later(main,600)}log(`⚠️ ${current.name} blocks your escape.`);return later(()=>openWheel(`Forced fight: ${current.name}`,'fight',weighted(winChance(),'WIN','LOSE')),450)}
if(mode==='attemptTrain'){if(res==='ALLOWED')return later(()=>openWheel('What do you train?','train',['Strength','Speed','Durability','Kekkei Genkai','Tailed Beast']),450);log(`⚠️ ${current.name} attacks before you can train.`);return later(()=>openWheel(`Forced fight: ${current.name}`,'fight',weighted(winChance(),'WIN','LOSE')),450)}
if(mode==='befriend'){if(res==='FRIEND'){if(!state.friends.includes(current.name))state.friends.push(current.name);log(`🤝 You befriended ${current.name}. ${get('Alignment')===current.faction?'Matching alignment helped.':''}`);renderStats();return later(()=>openWheel(`${current.name} friendship gift? — 80%`,'friendGift',weighted(80,'GIFT','NO GIFT')),500)}log(`❌ ${current.name} rejected your attempt to befriend them.`);if(enemyPower()>power()*1.25&&aggression()>=75){log(`⚠️ ${current.name} takes offense and attacks.`);return later(()=>openWheel(`Forced fight: ${current.name}`,'fight',weighted(winChance(),'WIN','LOSE')),450)}return later(main,650)}
if(mode==='friendGift'){if(res==='NO GIFT'){state.lastGift='None';log(`🎁 ${current.name} became your friend but gave no gift this time.`);renderStats();return later(main,650)}return later(()=>openWheel('Friendship Gift — rarity based','giftReward',weightedGiftPool()),500)}
if(mode==='giftReward'){
  const meta=giftRarity[res]||{rarity:'Unknown'};
  state.lastGift=`${res} (${meta.rarity})`;
  if(res==='Divine Fruit'){
    log(`🍎 ${current.name} gifted you a Divine Fruit — ${meta.rarity} rarity!`);
    return later(()=>openWheel('Eat the gifted Divine Fruit?','giftFruit',['EAT','EAT','SAVE']),500);
  }
  state.stolenEyes.push(res);
  log(`🎁 ${current.name} gifted you ${res} — ${meta.rarity} rarity. It gives +${eyeValue[res]||0} power.`);
  if(state.stolenEyes.length===3)log('🦾 Your third extra eye activates the ×1.5 eye-arm multiplier.');
  renderStats();
  return later(main,700);
}
if(mode==='giftFruit'){
  if(res==='SAVE'){state.bonus+=50;log('🍎 You saved the Divine Fruit. Its residual chakra grants +50 permanent power.');renderStats();return later(main,700)}
  return later(()=>openWheel('Gifted Divine Fruit Outcome','fruit',['BECOME ŌTSUTSUKI','TEN-TAILS','+100 POWER','+100 POWER','NOTHING','NOTHING','NOTHING','NOTHING','DIE']),500);
}


if(mode==='train'){state.training++;if(res==='Strength')state.str++;else if(res==='Speed')state.spd++;else if(res==='Durability')state.dur++;else if(res==='Kekkei Genkai'){const e=naturalEye();if(['Sharingan','Mangekyō Sharingan','Eternal Mangekyō Sharingan'].includes(e)){state.eyeStage=Math.min(3,state.eyeStage+1);log(`👁️ ${e} evolved into ${naturalEye()}.`)}else if(e==='Byakugan'){state.eyeStage=1;log('👁️ Byakugan evolved into Tenseigan.')}else log('🧬 Kekkei Genkai training increased mastery.')}else if(res==='Tailed Beast'){if(currentBeast()){state.bijuLevel=Math.min(bijuStageLabels().length-1,state.bijuLevel+1);log(`🐾 Bijū advanced to ${form().label}.`)}else log('🐾 You do not have a Tailed Beast yet.')}renderStats();return later(main,650)}

if(mode==='fight'){if(res==='WIN')return postWin();log(`❌ ${current.name} defeated you.`);return later(beginLossLoot,450)}

if(mode==='armFightBack'){
  if(res==='FIGHT BACK'){log(`🦾 You fought back and protected your arm.`);return later(resolveLossLoot,500)}
  const arms=playerStealableArms();
  if(!arms.length)return later(resolveLossLoot,450);
  if(arms.length===1){removePlayerArm(arms[0].label);return later(resolveLossLoot,500)}
  return later(()=>openWheel('Which special arm gets stolen?','whichArm',arms.map(a=>a.label)),450);
}
if(mode==='whichArm'){removePlayerArm(res);return later(resolveLossLoot,500)}

if(mode==='stealArm'){
  if(res==='SUCCESS'){
    const arm=enemyArmType();
    if(arm){state.stolenArms.push(arm);log(`🦾 You stole ${current.name}'s ${arm}. Your survival odds improve while you keep it.`);}
  }else log(`❌ You failed to steal ${current.name}'s arm.`);
  renderStats();
  return later(resolveWinLoot,550);
}

if(mode==='eyeFightBack'){if(res==='FIGHT BACK'){log(`⚔️ You fought back, escaped alive, and kept your eyes.`);state.hp=Math.max(1,state.hp-20);renderStats();return later(main,700)}pendingEyeTargets=ownedEyes();if(!pendingEyeTargets.length)return later(resolveLossLoot,450);if(pendingEyeTargets.length===1){removeEyeByLabel(pendingEyeTargets[0].label||pendingEyeTargets[0].eye);return later(resolveLossLoot,450)}return later(()=>openWheel('Which eye gets stolen?','whichEye',pendingEyeTargets.map(x=>x.label||x.eye)),450)}
if(mode==='whichEye'){removeEyeByLabel(res);return later(resolveLossLoot,450)}

if(mode==='jubiDefense'){if(res==='EVOLVE & KILL'){state.bijuLevel=Math.min(bijuStageLabels().length-1,state.bijuLevel+1);state.wins++;state.victoryBonus+=rewardAmount();log(`🔟 Your Jūbi evolved instead. You killed ${current.name} and survived.`);renderStats();return later(main,750)}const lost=currentBeast();state.ten=false;state.beasts=state.beasts.filter(b=>b.name!==lost.name);state.bijuLevel=0;log(`🔒 ${current.name} successfully stole your Jūbi.`);renderStats();return later(finishLoss,600)}

if(mode==='enemyBiju'){if(res==='SEALED AWAY'){const b=currentBeast();state.beasts=state.beasts.filter(x=>x.name!==b.name);const i=picks.findIndex(x=>x[0]==='Tailed Beast'&&String(x[1]).startsWith(b.name));if(i>=0)picks.splice(i,1);state.ten=false;state.bijuLevel=0;log(`🔒 ${current.name} extracted ${b.name}.`);renderStats()}else log('🐾 Your Bijū resisted extraction.');return later(resolveLossLoot,450)}

if(mode==='survive'){if(res==='SURVIVE'){state.hp=Math.max(1,state.hp-35);renderStats();return later(main,650)}if(currentBeast()&&form().index===form().max&&!state.baryonUsed){const lost=currentBeast();state.baryonUsed=true;log(`🔥 BARYON MODE activated. Temporary combat power exceeds the ${CAP} cap.`);log(`⚔️ ${current.name} is automatically defeated.`);state.wins++;state.victoryBonus+=rewardAmount();state.beasts=state.beasts.filter(x=>x.name!==lost.name);const i=picks.findIndex(x=>x[0]==='Tailed Beast'&&String(x[1]).startsWith(lost.name));if(i>=0)picks.splice(i,1);state.ten=false;state.bijuLevel=0;state.hp=20;log(`💀 ${lost.name} was permanently consumed.`);renderStats();return later(main,850)}return later(()=>openWheel(`Will someone reanimate you? — ${reanimateChance()}%${hasDanzoArm()?' (Danzō arm bonus)':''}`,'reanimate',weighted(reanimateChance(),'REANIMATED','STAY DEAD')),450)}

if(mode==='reanimate'){if(res==='REANIMATED'){state.reanimated=true;state.reanimator=reanimators[Math.floor(Math.random()*reanimators.length)];state.hp=100;log(`🪦 ${state.reanimator.name} reanimated you.`);renderStats();return later(main,750)}q('#wheelTitle').textContent='Your story ends.';q('#result').textContent='☠️ No reanimation.';return later(()=>reset(),1600)}

if(mode==='edoBreak'){if(res==='BREAK FREE'){const master=state.reanimator;state.reanimated=false;state.reanimator=null;currentType='person';current={name:master.name,power:master.power,agg:100};log(`⛓️ You broke free. Now defeat ${master.name}.`);renderStats();return later(showEncounter,650)}log('🪦 Edo control remains active.');return later(main,650)}

if(mode==='seal'||mode==='extract'){if(res==='SEALED'){const b=mode==='seal'?current:beasts.find(x=>x.name===current.beast);addBeast(b);renderStats()}else log('❌ Sealing failed.');return later(resolveWinLoot,550)}

if(mode==='stealEye'){if(res==='SUCCESS'){state.stolenEyes.push(current.eye);log(`👁️ You stole ${current.eye}. +${eyeValue[current.eye]||0} power from that eye.`);if(state.stolenEyes.length===3)log('🦾 Three stolen eyes activated the Danzō-style eye arm and ×1.5 multiplier.');renderStats()}else log('❌ Eye theft failed.');return later(resolveWinLoot,550)}

if(mode==='fruit'){if(res==='BECOME ŌTSUTSUKI'){const p=picks.find(x=>x[0]==='Race / Origin');if(p)p[1]='Ōtsutsuki';state.bonus+=100;log('🍎 You became an Ōtsutsuki.')}else if(res==='TEN-TAILS'){state.ten=true;state.bijuLevel=0;log('🔟 You became the Ten-Tails host.')}else if(res==='+100 POWER'){state.bonus+=100;log('💥 +100 permanent power.')}else if(res==='DIE')return later(()=>openWheel(`Will someone reanimate you? — ${reanimateChance()}%${hasDanzoArm()?' (Danzō arm bonus)':''}`,'reanimate',weighted(reanimateChance(),'REANIMATED','STAY DEAD')),450);else log('🌳 Nothing happened.');renderStats();return later(main,650)}

if(mode==='legacy'){if(res==='FOUND VILLAGE'){state.hokage=true;const seed={clan:get('Clan'),race:get('Race / Origin'),alignment:get('Alignment')};log('🏯 You founded a village and became Hokage. Your next character is your child with the same clan, better rare-eye odds, and higher Jinchūriki odds.');return later(()=>reset(seed),1100)}if(res==='FORBIDDEN EYE')return later(()=>openWheel('Forbidden Eye Destiny','legacyEye',['JŌGAN','RINNE SHARINGAN','FAILED','FAILED']),450);if(res==='OLD AGE'){if(get('Race / Origin')==='Ōtsutsuki'){state.bonus+=100;log('♾️ Your Ōtsutsuki body survives old age.');renderStats();return later(main,650)}return later(()=>openWheel(`Old age — reanimation? ${reanimateChance()}%`,'reanimate',weighted(reanimateChance(),'REANIMATED','STAY DEAD')),450)}}

if(mode==='legacyEye'){if(res==='JŌGAN'){state.stolenEyes.push('Jōgan');log('👁️ A stolen eye awakened into Jōgan (+300).')}else if(res==='RINNE SHARINGAN'){state.stolenEyes.push('Rinne Sharingan');log('👁️ A stolen eye awakened into Rinne Sharingan (+350).')}else log('❌ Eye awakening failed.');renderStats();const p=people.filter(x=>x.race==='Ōtsutsuki');currentType='person';current=p[Math.floor(Math.random()*p.length)];log(`⚠️ ${current.name} immediately appears to fight you.`);return later(showEncounter,650)}
}

function checkLegacy(){if(state.legacyTriggered||power()<LEGACY_POWER||state.reanimated)return;state.legacyTriggered=true;log(`🌟 ${LEGACY_POWER} POWER REACHED — Special Legacy Wheel unlocked.`);later(()=>openWheel(`${LEGACY_POWER} Power Legacy Wheel`,'legacy',['FOUND VILLAGE','FORBIDDEN EYE','OLD AGE']),550)}

q('#fight').onclick=()=>openWheel(`Fight ${current.name}`,'fight',weighted(winChance(),'WIN','LOSE'));
q('#escape').onclick=()=>openWheel(`Escape ${current.name}? — ${escapeChance()}%`,'attemptEscape',weighted(escapeChance(),'ESCAPED','CAUGHT'));
q('#trainEncounter').onclick=()=>openWheel(`Can you train safely? — ${trainChance()}%`,'attemptTrain',weighted(trainChance(),'ALLOWED','ATTACKED'));
q('#befriend').onclick=()=>openWheel(`Befriend ${current.name}? — ${befriendChance()}%`,'befriend',weighted(befriendChance(),'FRIEND','REJECTED'));q('#eatFruit').onclick=()=>openWheel('Eat Chakra Fruit','fruit',['BECOME ŌTSUTSUKI','TEN-TAILS','+100 POWER','+100 POWER','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','NOTHING','DIE']);
q('#leaveTree').onclick=main;
q('#restart').onclick=()=>reset();

function bindSpinButton(el, fn){
  if(!el)return;
  el.disabled=false;
  el.style.pointerEvents='auto';
  el.style.touchAction='manipulation';
  el.onclick=function(ev){
    if(ev){ev.preventDefault();ev.stopPropagation();}
    fn();
  };
}

// Bind controls only after every function exists.
bindSpinButton(q('#spinBuild'), spinBuildNow);
bindSpinButton(q('#spinAction'), spinActionNow);

// Actually initialize the game.
reset();
})();
</script>
</body></html>
